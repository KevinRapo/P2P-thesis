# Website for the docs (docs/), built with MkDocs Material.
#
# The source stays docs/, unchanged and readable in VS Code / on GitHub.
# Everything a website needs differently happens at build time in hooks.py.
#
#   python run_docs.py          # live preview (run_docs.py: the whole pipeline)
#   python run_docs.py build    # strict check, static site in site/
#
# The site is only built locally; it is not published.

site_name: MARLEM v2
site_description: MARLEM rebuilt on SimBench networks (V2, PPO with mixed market actions)
repo_url: https://github.com/KevinRapo/P2P-thesis
edit_uri: blob/marlem-v2/docs/
docs_dir: ../docs
site_dir: ../site
dev_addr: 127.0.0.1:8001

extra:
  # Links to code outside docs/ become links to this repository and branch.
  code_links:
    repo: https://github.com/KevinRapo/P2P-thesis
    ref: marlem-v2

hooks:
  - hooks.py

# `mkdocs serve` also rebuilds when these change: the code (API pages stay
# current), the build hooks (reloaded on every rebuild) and the site assets.
# This list is read once at start: after adding or renaming a top-level code
# folder, restart the server once.
watch:
  - ../core
  - ../studio
  - hooks.py
  - overrides

exclude_docs: |
  *.py
  *.json

theme:
  name: material
  # Site assets that are not docs: overrides/assets/ (diagram zoom, wider layout).
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      permalink: true
      # GitHub-style anchors, so in-document links work in VS Code and here.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # Not "mermaid": Material would draw it in a closed shadow DOM that
        # cannot be zoomed. overrides/assets/diagrams.js renders these instead.
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tilde

extra_css:
  - assets/diagrams.css
  - assets/marks.css
  - assets/sidebar.css
  - assets/headings.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js
  - assets/diagrams.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  # "Last update" under each page, from the file's git history. A page with no commit
  # yet (new, untracked) shows the build date. No creation date: for such a page the
  # plugin warns, and the strict build then fails.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_if_no_docstring: true
            filters: ["!^_"]
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

validation:
  links:
    anchors: warn

nav:
  - Home: 
    - index.md
    - About these docs: about.md
  - Getting started:
      - Code environment setup: getting-started/setup.md
      - HPC setup/helper scripts: hpc/setup.md
      - Notebook sessions: hpc/notebooks.md
      - Glossary: getting-started/glossary.md
      - First steps: getting-started/first-steps.md
  # The original as published: the papers' definitions and every issue in its release.
  - Original MARLEM:
      - Market methodology: marlem/methodology.md
      - Learning layer: marlem/learning/index.md
      - Issues in the release:
          - Issue register: validation/register.md
          - Market layer: validation/market.md
          - RL layer: validation/rl.md
          - The two papers: validation/papers.md
  # Why this version departs from the original by design, beyond its defects.
  - Why?:
      - The RL layer: why/rl-layer.md
  # This version: what each component computes and why (equations, decisions).
  - Methodology:
      - Overview: overview.md
      - The full cycle: full-cycle/index.md
      - Market layer:
          - Market step: full-cycle/market-step.md
          - Tariffs and the peer charge: full-cycle/tariffs.md
          - Grid methods: experiments/grid-methods.md

      - Environment:
          - Index: full-cycle/environment/index.md
          - Action: full-cycle/environment/action.md
          - Reward: full-cycle/environment/reward.md
          - Observation: full-cycle/environment/observation.md

      - Learning layer: 
          - High level: full-cycle/learning/index.md
          - One iteration, step by step: full-cycle/learning/iteration.md
          - Worked examples: full-cycle/learning/examples.md

      - Code structure: 
                - Structure: structure.md
                
      - Validation:
          - Index: checks/index.md
          - The RL probes: full-cycle/learning/probes.md
  - Using it:
      - Data:
          - Simbench: simbench/README.md
          - Network catalogue: simbench/networks.md
          - Profiles: simbench/profiles.md
          - Market prices: prices/index.md
      - Experiment config: config/reference.md
      - Studio UI:
          - studio/index.md
          - Results:
              - studio/results/index.md
              - Metrics: studio/results/metrics.md
              - Validation: studio/results/validation.md
              - Learning: studio/results/learning.md
              - Market: studio/results/market.md
              - Grid: studio/results/grid.md
              - Saved files: studio/results/files.md
      - Run contract: config/run-contract.md
      - Training experiments: hpc/experiments.md
      - HPC:
          - hpc.md
          - Resources and parallelism: hpc/resources.md
          - Measurements and cost estimates: hpc/performance.md
          - Monitoring and troubleshooting: hpc/operations.md
  - Experiments:
      - experiments/index.md
      - "Market runs: seeds, CTCE, more agents": experiments/market-s3.md
  # Temporary: plans and open items of the work in progress. Removed at the end;
  # nothing outside this tab may depend on these pages.
  - Workspace:
      - plan/index.md
      - Open items: plan/open.md
      - Market plan: plan/market.md
      - RL plan: plan/rl.md
      - Results plan: plan/results.md
      - Validate section plan: plan/validation.md
      - Decision log: plan/decisions.md
  # Filled in by hooks.py: one section per top-level folder, one page per module.
  - API Reference: api/index.md
