# Website for the docs (docs/), built with MkDocs Material.
#
# The source stays docs/, unchanged and readable in VS Code / on GitHub.
# Everything a website needs differently happens at build time in hooks.py.
#
#   python run_docs.py          # live preview (run_docs.py: the whole pipeline)
#   python run_docs.py build    # strict check, static site in site/
#
# The site is only built locally; it is not published.

site_name: MARLEM v2
site_description: MARLEM rebuilt on SimBench networks (V2, PPO with mixed market actions)
repo_url: https://github.com/KevinRapo/P2P-thesis
edit_uri: blob/marlem-v2/docs/
docs_dir: ../docs
site_dir: ../site
dev_addr: 127.0.0.1:8001

extra:
  # Links to code outside docs/ become links to this repository and branch.
  code_links:
    repo: https://github.com/KevinRapo/P2P-thesis
    ref: marlem-v2

hooks:
  - hooks.py

# `mkdocs serve` also rebuilds when these change: the code (API pages stay
# current), the build hooks (reloaded on every rebuild) and the site assets.
# This list is read once at start: after adding or renaming a top-level code
# folder, restart the server once.
watch:
  - ../core
  - ../studio
  - hooks.py
  - overrides

exclude_docs: |
  *.py
  *.json

theme:
  name: material
  # Site assets that are not docs: overrides/assets/ (diagram zoom, wider layout).
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.path
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      permalink: true
      # GitHub-style anchors, so in-document links work in VS Code and here.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # Not "mermaid": Material would draw it in a closed shadow DOM that
        # cannot be zoomed. overrides/assets/diagrams.js renders these instead.
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tilde

extra_css:
  - assets/diagrams.css
  - assets/marks.css
  - assets/sidebar.css
  - assets/headings.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js
  - assets/diagrams.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  # "Last update" under each page, from the file's git history. A page with no commit
  # yet (new, untracked) shows the build date. No creation date: for such a page the
  # plugin warns, and the strict build then fails.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_if_no_docstring: true
            filters: ["!^_"]
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

validation:
  links:
    anchors: warn

# One section per folder under docs/, in the folders' layout: a page's place in the
# nav is its place on disk.
nav:
  - Home:
      - index.md
      - About these docs: about.md
  - Getting started:
      - Code environment setup: getting-started/setup.md
      - HPC setup and helper scripts: getting-started/hpc-setup.md
      - Notebook sessions: getting-started/notebooks.md
      - Glossary: getting-started/glossary.md
      - First steps: getting-started/first-steps.md
  # The original as published: the papers' definitions and every issue in its release.
  - Original MARLEM:
      - Market methodology: original/methodology.md
      - Learning layer: original/learning.md
      - Issues in the release:
          - Issue register: original/issues/register.md
          - Market layer: original/issues/market.md
          - RL layer: original/issues/rl.md
          - The two papers: original/issues/papers.md
  # Why this version departs from the original by design, beyond its defects.
  - "Why?":
      - The RL layer: why/rl-layer.md
  # This version: what each component computes and why (equations, decisions).
  - Methodology:
      - methodology/index.md
      - The full cycle: methodology/full-cycle.md
      - Market layer:
          - Market step: methodology/market/step.md
          - Tariffs and the peer charge: methodology/market/tariffs.md
          - Grid methods: methodology/market/grid-methods.md
      - Environment:
          - methodology/environment/index.md
          - Action: methodology/environment/action.md
          - Reward: methodology/environment/reward.md
          - Observation: methodology/environment/observation.md
      - Learning layer:
          - methodology/learning/index.md
          - One iteration, step by step: methodology/learning/iteration.md
          - Worked examples: methodology/learning/examples.md
      - Code structure: methodology/structure.md
      - Validation:
          - methodology/validation/index.md
          - The RL probes: methodology/validation/probes.md
  - Using it:
      - Data:
          - SimBench: using/data/simbench.md
          - Network catalogue: using/data/networks.md
          - Profiles: using/data/profiles.md
          - Market prices: using/data/prices.md
      - Experiment config: using/config.md
      - Studio UI:
          - using/studio/index.md
          - Results:
              - using/studio/results/index.md
              - Metrics: using/studio/results/metrics.md
              - Validation: using/studio/results/validation.md
              - Learning: using/studio/results/learning.md
              - Market: using/studio/results/market.md
              - Grid: using/studio/results/grid.md
              - Saved files: using/studio/results/files.md
      - Run contract: using/run-contract.md
      - Training experiments: using/training-experiments.md
      - HPC:
          - using/hpc/index.md
          - Resources and parallelism: using/hpc/resources.md
          - Measurements and cost estimates: using/hpc/performance.md
          - Monitoring and troubleshooting: using/hpc/operations.md
  - Experiments:
      - experiments/index.md
      - "Market runs: seeds, CTCE, more agents": experiments/market-s3.md
  # Temporary: plans and open items of the work in progress. Removed at the end;
  # nothing outside this folder may depend on its pages.
  - Workspace:
      - workspace/index.md
      - Open items: workspace/open.md
      - Market plan: workspace/market.md
      - RL plan: workspace/rl.md
      - Results plan: workspace/results.md
      - Validate section plan: workspace/validation.md
      - Decision log: workspace/decisions.md
  # Filled in by hooks.py: one section per top-level folder, one page per module.
  - API Reference: api/index.md
