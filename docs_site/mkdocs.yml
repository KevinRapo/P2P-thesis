# Website for the docs (docs/), built with MkDocs Material.
#
# The source stays docs/, unchanged and readable in VS Code / on GitHub.
# Everything a website needs differently happens at build time in hooks.py.
#
#   python run_docs.py          # live preview (run_docs.py: the whole pipeline)
#   python run_docs.py build    # strict check, static site in site/
#
# The site is only built locally; it is not published.

site_name: MARLEM v2
site_description: MARLEM rebuilt on SimBench networks (V2, PPO with mixed market actions)
repo_url: https://github.com/KevinRapo/P2P-thesis
edit_uri: blob/marlem-v2/docs/
docs_dir: ../docs
site_dir: ../site
dev_addr: 127.0.0.1:8001

extra:
  # Links to code outside docs/ become links to this repository and branch.
  code_links:
    repo: https://github.com/KevinRapo/P2P-thesis
    ref: marlem-v2

hooks:
  - hooks.py

# `mkdocs serve` also rebuilds when these change: the code (API pages stay
# current), the build hooks (reloaded on every rebuild) and the site assets.
# This list is read once at start: after adding or renaming a top-level code
# folder, restart the server once.
watch:
  - ../core
  - ../studio
  - hooks.py
  - overrides

exclude_docs: |
  *.py
  *.json

theme:
  name: material
  # Site assets that are not docs: overrides/assets/ (diagram zoom, wider layout).
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - footnotes
  - toc:
      permalink: true
      # GitHub-style anchors, so in-document links work in VS Code and here.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # Not "mermaid": Material would draw it in a closed shadow DOM that
        # cannot be zoomed. overrides/assets/diagrams.js renders these instead.
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tilde

extra_css:
  - assets/diagrams.css
  - assets/marks.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js
  - assets/diagrams.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_if_no_docstring: true
            filters: ["!^_"]
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  # The MARLEM papers and what was found in them and in their code.
  - MARLEM:
      - Paper overview:
          - Methodology: marlem/methodology.md
          - Learning layer: marlem/learning.md
      - Validation:
          - Issue register: validation/register.md
          - Market layer: validation/market.md
          - RL layer: validation/rl.md
          - The two papers: validation/papers.md
  # This thesis's implementation.
  - Implementation:
      - marlem-v1: v1.md
      - marlem-v2: v2.md
      - Code structure: structure.md
      - The full cycle: full-cycle.md
      - Plans:
          - plan/index.md
          - Market plan: plan/market.md
          - RL plan: plan/rl.md
          - Decision log: plan/decisions.md
      - Reinforcement learning:
          - Observation: rl/observation.md
          - Probes:
              - How the probes work: rl/probes.md
          - RL helpers:
              - Training cycle (PPO × 3): rl/training.md
              - One iteration, step by step: rl/cycle.md
              - Worked examples (our code): rl/examples.md
      - SimBench:
          - simbench/README.md
          - Network catalogue: simbench/networks.md
          - Profiles: simbench/profiles.md
  # What the thesis compares, and how.
  - Experiments:
      - Grid-method comparison: experiments/grid-methods.md
      - "Market runs: seeds, CTCE, more agents": experiments/market-s3.md
  # Running on the TalTech cluster.
  - HPC:
      - Overview: hpc.md
      - Getting started:
          - Setup and helper scripts: hpc/setup.md
      - Running work:
          - Notebook sessions: hpc/notebooks.md
          - Training experiments: hpc/experiments.md
      - Reference:
          - Resources and parallelism: hpc/resources.md
          - Measurements and cost estimates: hpc/performance.md
          - Monitoring and troubleshooting: hpc/operations.md
  # Filled in by hooks.py: one section per top-level folder, one page per module.
  - API Reference: api/index.md
