# Website for the thesis documentation (docs_thesis/), built with MkDocs Material.
#
# The source stays docs_thesis/, unchanged and readable in VS Code / on GitHub.
# Everything a website needs differently happens at build time in hooks.py.
#
#   mkdocs serve -f docs_site/mkdocs.yml     # live preview, http://127.0.0.1:8000
#   mkdocs build -f docs_site/mkdocs.yml     # static site in site/
#
# Remove this folder (and site/) to go back to plain Markdown only.

site_name: MARLEM thesis docs
site_description: Validation and SimBench rebuild of MARLEM
repo_url: https://github.com/KevinRapo/P2P-thesis
edit_uri: blob/dev/docs_thesis/
docs_dir: ../docs_thesis
site_dir: ../site

extra:
  # Links to code outside docs_thesis/ become links to this repository and branch.
  code_links:
    repo: https://github.com/KevinRapo/P2P-thesis
    ref: dev

hooks:
  - hooks.py

# `mkdocs serve` also rebuilds when these change: the code (API pages stay
# current) and the site assets. Changes to hooks.py need a restart of
# `mkdocs serve`: it keeps the first loaded version of the hooks.
watch:
  - ../src_thesis
  - overrides

theme:
  name: material
  # Site assets that are not docs: overrides/assets/ (diagram zoom, wider layout).
  custom_dir: overrides
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
      # GitHub-style anchors, so in-document links work in VS Code and here.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        # Not "mermaid": Material would draw it in a closed shadow DOM that
        # cannot be zoomed. overrides/assets/diagrams.js renders these instead.
        - name: mermaid
          class: mermaid-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tilde

extra_css:
  - assets/diagrams.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.2/dist/svg-pan-zoom.min.js
  - assets/diagrams.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            show_source: true
            show_root_heading: true
            members_order: source
            docstring_style: google
            show_if_no_docstring: true
            filters: ["!^_"]
            summary: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true

not_in_nav: |
  /thesis/validation/archive/

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Guide:
      - Studio workflow: guide/studio-workflow.md
      - Network catalogue: guide/networks.md
  - Papers:
      - Methodology: paper/marlem-methodology.md
      - Paper-to-code map: paper/marlem-paper-to-code-map.md
  - Validation:
      - thesis/validation/README.md
      - Issue register: thesis/validation/issues.md
      - Method vs code: thesis/validation/methodology.md
      - Plan: thesis/validation/plan.md
      - RL testbench: thesis/validation/rl-testbench.md
      - Keep / replace audit: thesis/validation/marlem-keep-replace-audit.md
  - Architecture:
      - thesis/architecture/README.md
      - 01 SimBench grid: thesis/architecture/01-simbench-grid.md
      - 02 Experiment file: thesis/architecture/02-experiment-config.md
      - 03 Experiment layer: thesis/architecture/03-experiment-layer.md
      - 04 Application layer: thesis/architecture/04-application-layer.md
      - 05 Presentation: thesis/architecture/05-presentation.md
      - Implementation status: thesis/architecture/implementation-status.md
  # Filled in by hooks.py: one section per layer, one page per module.
  - API Reference: api/index.md
  - Index of docs: thesis/README.md
