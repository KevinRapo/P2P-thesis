# Builds the docs website and publishes it on GitHub Pages.
# Runs when a push to marlem-v2 changes the docs, or the code behind the API pages.
name: Docs

on:
  push:
    branches: [marlem-v2]
    paths:
      - "docs/**"
      - "docs_site/**"
      - "core/**"
      - "studio/**"
      - "run_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a deployment still waiting to run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs_site/requirements.txt
      - run: pip install -r docs_site/requirements.txt
      - run: python run_docs.py build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
