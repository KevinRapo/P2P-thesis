name: validation

on:
  push:
  pull_request:

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: marlem
          environment-file: environment.yml
          auto-activate-base: false
      - run: pytest -q
        shell: bash -el {0}
