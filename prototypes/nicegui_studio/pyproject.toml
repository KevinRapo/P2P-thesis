[project]
name = "marlem-studio-nicegui-prototype"
version = "0.1.0"
description = "Standalone NiceGUI boilerplate for the MARLEM Studio architecture"
requires-python = ">=3.12,<3.14"
dependencies = [
    "nicegui[plotly]==3.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
