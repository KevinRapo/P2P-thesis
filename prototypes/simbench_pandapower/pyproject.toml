[project]
name = "marlem-simbench-pandapower-prototype"
version = "0.1.0"
description = "Standalone SimBench and pandapower power-flow proof for MARLEM"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numba>=0.67.0",
    "pandapower==3.5.4",
    "simbench==1.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
